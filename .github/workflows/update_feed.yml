name: Actualizar Feed RSS Filtrado

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Otorga permisos para que el workflow suba cambios
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script de filtrado
        run: python filter_feed.py

      - name: Guardar y hacer Push del feed actualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update: actualizar feed filtrado"
          file_pattern: "filtered_feed.xml"
